---
- name: Reset root passwords on authorized Linux hosts
  hosts: localhost
  gather_facts: false

  vars:
    password_csv: "passwd.csv"
    execution_lock: "/tmp/root_password_reset.lock"
    successful_report: "/tmp/root_password_reset_success.csv"
    failed_report: "/tmp/root_password_reset_failed.csv"

  tasks:
    - name: Check for an existing execution lock
      ansible.builtin.stat:
        path: "{{ execution_lock }}"
      register: lock_status

    - name: Stop if another reset is running
      ansible.builtin.fail:
        msg: >-
          The lock file {{ execution_lock }} already exists.
          Confirm that no password-reset process is running before
          removing a stale lock.
      when: lock_status.stat.exists

    - name: Create execution lock
      ansible.builtin.file:
        path: "{{ execution_lock }}"
        state: touch
        mode: "0600"

    - name: Perform controlled root password reset
      block:
        - name: Read hostname and password data
          community.general.read_csv:
            path: "{{ password_csv }}"
            delimiter: ","
          register: csv_data
          no_log: true

        - name: Validate password-reset input
          ansible.builtin.assert:
            that:
              - csv_data.list | length > 0
              - item.Hostname is defined
              - item.Hostname | length > 0
              - item.Password is defined
              - item.Password | length > 0
            fail_msg: "Every CSV row requires a hostname and password."
            quiet: true
          loop: "{{ csv_data.list }}"
          no_log: true

        - name: Check SSH connectivity
          ansible.builtin.command:
            cmd: hostname
          delegate_to: "{{ item.Hostname }}"
          loop: "{{ csv_data.list }}"
          register: connectivity_results
          changed_when: false
          failed_when: false
          no_log: true

        - name: Reset root password on reachable hosts
          ansible.builtin.user:
            name: root
            password: >-
              {{
                item.item.Password
                | password_hash(
                    'sha512',
                    65534 | random(seed=item.item.Hostname)
                    | string
                  )
              }}
            update_password: always
          delegate_to: "{{ item.item.Hostname }}"
          become: true
          loop: "{{ connectivity_results.results }}"
          when: item.rc | default(1) == 0
          register: reset_results
          failed_when: false
          no_log: true

        - name: Initialize result lists
          ansible.builtin.set_fact:
            successful_hosts: []
            failed_hosts: []

        - name: Record successful password resets
          ansible.builtin.set_fact:
            successful_hosts: >-
              {{
                successful_hosts
                + [item.item.item.Hostname]
              }}
          loop: "{{ reset_results.results | default([]) }}"
          when:
            - not item.skipped | default(false)
            - not item.failed | default(false)
          no_log: true

        - name: Record failed or unreachable hosts
          ansible.builtin.set_fact:
            failed_hosts: >-
              {{
                csv_data.list
                | map(attribute='Hostname')
                | difference(successful_hosts)
                | list
              }}
          no_log: true

        - name: Generate successful host report
          ansible.builtin.copy:
            dest: "{{ successful_report }}"
            mode: "0600"
            content: |
              Hostname,Status
              {% for host in successful_hosts %}
              {{ host }},Success
              {% endfor %}

        - name: Generate failed host report
          ansible.builtin.copy:
            dest: "{{ failed_report }}"
            mode: "0600"
            content: |
              Hostname,Status
              {% for host in failed_hosts %}
              {{ host }},Failed or Unreachable
              {% endfor %}

        - name: Display reset summary
          ansible.builtin.debug:
            msg:
              - "Successful resets: {{ successful_hosts | length }}"
              - "Failed or unreachable: {{ failed_hosts | length }}"
              - "Success report: {{ successful_report }}"
              - "Failure report: {{ failed_report }}"

      always:
        - name: Remove execution lock
          ansible.builtin.file:
            path: "{{ execution_lock }}"
            state: absent
