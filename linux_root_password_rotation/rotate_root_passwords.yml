---
- name: Rotate root passwords on authorized Linux hosts
  hosts: localhost
  gather_facts: false

  vars:
    targets_file: "password_rotation_targets.yml"
    lock_file: "/tmp/root_password_rotation.lock"
    successful_report: "/tmp/root_password_rotation_success.csv"
    failed_report: "/tmp/root_password_rotation_failed.csv"

  tasks:
    - name: Check whether another rotation is running
      ansible.builtin.stat:
        path: "{{ lock_file }}"
      register: rotation_lock

    - name: Stop when another rotation is running
      ansible.builtin.fail:
        msg: >-
          The lock file {{ lock_file }} already exists.
          Verify that no rotation is running before removing a stale lock.
      when: rotation_lock.stat.exists

    - name: Create execution lock
      ansible.builtin.file:
        path: "{{ lock_file }}"
        state: touch
        mode: "0600"

    - name: Perform controlled password rotation
      block:
        - name: Load encrypted rotation targets
          ansible.builtin.include_vars:
            file: "{{ targets_file }}"
          no_log: true

        - name: Validate target data
          ansible.builtin.assert:
            that:
              - password_rotation_targets is defined
              - password_rotation_targets | length > 0
              - item.hostname is defined
              - item.password_hash is defined
              - item.password_hash is match('^\$6\$')
            fail_msg: "Each target must contain a hostname and SHA-512 password hash."
            quiet: true
          loop: "{{ password_rotation_targets }}"
          no_log: true

        - name: Check SSH connectivity to target hosts
          ansible.builtin.command:
            cmd: hostname
          delegate_to: "{{ item.hostname }}"
          loop: "{{ password_rotation_targets }}"
          register: connectivity_results
          changed_when: false
          failed_when: false
          no_log: true

        - name: Rotate root passwords on reachable hosts
          ansible.builtin.user:
            name: root
            password: "{{ item.item.password_hash }}"
            update_password: always
          delegate_to: "{{ item.item.hostname }}"
          become: true
          loop: "{{ connectivity_results.results }}"
          when: item.rc | default(1) == 0
          register: rotation_results
          failed_when: false
          no_log: true

        - name: Initialize report data
          ansible.builtin.set_fact:
            successful_hosts: []
            failed_hosts: []

        - name: Record successful password rotations
          ansible.builtin.set_fact:
            successful_hosts: "{{ successful_hosts + [item.item.item.hostname] }}"
          loop: "{{ rotation_results.results | default([]) }}"
          when:
            - not item.skipped | default(false)
            - not item.failed | default(false)
          no_log: true

        - name: Record failed or unreachable hosts
          ansible.builtin.set_fact:
            failed_hosts: >-
              {{
                password_rotation_targets
                | map(attribute='hostname')
                | difference(successful_hosts)
                | list
              }}
          no_log: true

        - name: Create successful host report
          ansible.builtin.copy:
            dest: "{{ successful_report }}"
            mode: "0600"
            content: |
              Hostname,Status
              {% for host in successful_hosts %}
              {{ host }},Success
              {% endfor %}

        - name: Create failed host report
          ansible.builtin.copy:
            dest: "{{ failed_report }}"
            mode: "0600"
            content: |
              Hostname,Status
              {% for host in failed_hosts %}
              {{ host }},Failed or Unreachable
              {% endfor %}

        - name: Display rotation summary
          ansible.builtin.debug:
            msg:
              - "Successful rotations: {{ successful_hosts | length }}"
              - "Failed or unreachable: {{ failed_hosts | length }}"
              - "Success report: {{ successful_report }}"
              - "Failure report: {{ failed_report }}"

      always:
        - name: Remove execution lock
          ansible.builtin.file:
            path: "{{ lock_file }}"
            state: absent
